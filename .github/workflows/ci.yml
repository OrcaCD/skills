name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plugin:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout code
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Setup Node.js
        with:
          node-version: 25

      # Validate against the latest releases, since that is what users install the plugin with.
      # No lockfile on purpose: pinning would validate against outdated CLIs.
      - name: Install Claude Code and Codex
        run: npm install --global @anthropic-ai/claude-code@latest @openai/codex@latest # zizmor: ignore[adhoc-packages]

      - name: Validate Claude Code plugin and marketplace
        run: claude plugin validate .

      - name: Install plugin in Codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add orcacd@orcacd

      - name: Run repository checks
        run: python3 scripts/validate.py

  skills:
    name: Validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout code
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        name: Setup uv
        with:
          enable-cache: false

      # Reference validator from the Agent Skills specification
      - name: Validate SKILL.md files
        env:
          SKILLS_REF: git+https://github.com/agentskills/agentskills@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref
        run: |
          shopt -s nullglob
          status=0
          for skill in skills/*/; do
            uvx --from "$SKILLS_REF" skills-ref validate "$skill" || status=1
          done
          exit "$status"

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout code
        with:
          persist-credentials: false

      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        name: Run markdownlint

  actions:
    name: Check GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # Required to upload zizmor results as security events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout code
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
