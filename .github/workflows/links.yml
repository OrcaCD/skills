name: Links

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # Required to open an issue for broken links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout code
        with:
          persist-credentials: false

      # Skills link to the docs instead of copying them, so a docs restructure breaks them silently
      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress "./**/*.md"
          output: lychee/out.md
          fail: false

      - name: Open issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Broken links found
        run: |
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file lychee/out.md
          else
            gh issue create --title "$TITLE" --body-file lychee/out.md
          fi
